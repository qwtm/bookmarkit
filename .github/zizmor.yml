rules:
  secrets-outside-env:
    config:
      # Dedicated automation credentials for the version branch and tag jobs;
      # their triggers and permissions constrain their use.
      allow:
        - RELEASE_TOKEN
        - CHORES_DUMB_CLIENT_ID
        - CHORES_DUMB_PRIVATE_KEY
  unpinned-uses:
    config:
      policies:
        # ENG-0004: governed shared reusable workflows intentionally track the
        # compatible v1 ref; every other action must use a full commit SHA.
        "qwts/playbook-software-engineering/*": ref-pin
        "*": hash-pin
