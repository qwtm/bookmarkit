# Version-cut automation (#8), mirroring qwts/photos and qwts/overlook:
#
#  1. version-pr — while changesets are pending, keep one rolling version PR open and current.
#     Merging that PR is the human "cut a release" action.
#  2. tag — after the version PR merges (package version changed, no pending changesets), tag
#     v<version> and hand off to the release workflow.
#
# Both halves authenticate as chores-dumb[bot], a GitHub App whose installation token is minted
# per run. There is no PAT or GITHUB_TOKEN write fallback. Two reasons for the App:
#  - GITHUB_TOKEN events cannot trigger other workflows. A bot-refreshed version PR got no
#    pull_request CI runs, and a GITHUB_TOKEN tag push fired no on:push:tags run — both needed
#    explicit dispatches.
#  - This repository's Actions actor policy authorizes actors explicitly, and github-actions[bot]
#    is not among them. Anything it triggers — including those dispatches — dies at startup with
#    "Actor is not allowed to trigger Actions workflows".
# Under the App the actor is an authorized non-human account and both events fire on their own:
# the version PR gets real pull_request runs, and the tag push starts release.yml directly. It
# also un-deadlocks review — a PAT opens the version PR as qwts, who cannot approve their own PR,
# so every cut needed a bypass. chores-dumb[bot] opens it, and a human approves.
# Missing or unreadable App credentials fail closed before a repository write.
name: Version cut

on:
  push:
    branches:
      - main
  # Manual refresh / recovery for a cut whose tag or release dispatch failed.
  workflow_dispatch:

concurrency:
  group: version-cut
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@5455a3f5939369ea843b1bbb4d2573739f4381a6 # ci-policy 2026-08-20
        with:
          authorization-only: "true"

  version-pr:
    name: Version packages PR
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_CHORES_DUMB: ${{ secrets.CHORES_DUMB_CLIENT_ID != '' && secrets.CHORES_DUMB_PRIVATE_KEY != '' }}
    steps:
      - name: Require chores-dumb credentials
        run: test "$HAS_CHORES_DUMB" = true

      - name: Mint the chores-dumb token
        id: chores
        # actions/* — first-party, so the App key never reaches a third-party action.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id, not app-id: v3 deprecated the latter, and the two are easy
          # to confuse with the bot's *user* id, which is a third number entirely.
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
          # Narrow the installation token — zizmor github-app audit.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6 # bounded-command 2026-08-20
        with:
          task: Install version-cut dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: "600"
          attempts: "2"
          retry-delay-seconds: "5"

      - name: Create or refresh the ready version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # changeset:version also syncs public/manifest.json and package-lock.json, so the
          # version PR lands every version artifact in one reviewed commit.
          version: npm run changeset:version
          title: "chore: version bookmarkit"
          commit: "chore: version bookmarkit"
        env:
          GITHUB_TOKEN: ${{ steps.chores.outputs.token }}

  tag:
    name: Tag version merges
    needs: [policy, version-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      HAS_CHORES_DUMB: ${{ secrets.CHORES_DUMB_CLIENT_ID != '' && secrets.CHORES_DUMB_PRIVATE_KEY != '' }}
    steps:
      - name: Require chores-dumb credentials
        run: test "$HAS_CHORES_DUMB" = true

      - name: Mint the chores-dumb token
        id: chores
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
          permission-contents: write
          # Stranded-tag recovery: gh workflow run release.yml
          permission-actions: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do not persist the App/PAT into .git — push via `gh auth setup-git`
          # with GH_TOKEN in the tag step instead (zizmor artipacked).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Tag when the current version is a fresh cut
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A normal main push is a release cut only when package.json's version changed. Manual
          # dispatch is recovery-only and still must pass the checks below.
          if [ "$EVENT_NAME" = "push" ]; then
            prev=$(git show 'HEAD~1:package.json' 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' 2>/dev/null || echo '')
            cur=$(node -p 'require("./package.json").version')
            if [ "$prev" = "$cur" ]; then
              echo "Version unchanged ($cur) — not a version-cut merge."
              exit 0
            fi
          fi

          pending=$(find .changeset -name '*.md' ! -name 'README.md' | head -1)
          if [ -n "$pending" ]; then
            echo "Changesets pending — nothing to tag."
            exit 0
          fi

          # Refuse to tag a tree whose version artifacts disagree; the tag name comes from
          # package.json, so drift here would ship a mislabeled zip.
          npm run check:version-policy
          version="v$(node -p 'require("./package.json").version')"

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version already tagged."
            # The one dispatch that survives: an already-existing tag has no push
            # event left to replay. It runs as chores-dumb because
            # github-actions[bot] is refused by the Actions actor policy.
            if ! gh release view "$version" >/dev/null 2>&1; then
              echo "$version has no release — dispatching recovery."
              gh workflow run release.yml --ref main -f tag="$version" \
                || echo "::notice::release.yml not dispatchable — $version still has no release."
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$version" -m "bookmarkit $version"
          # Checkout kept persist-credentials: false; wire the authorized token
          # only for this push so release.yml's on:push:tags fires as chores-dumb.
          gh auth setup-git
          git push origin "$version"
          echo "Tagged $version."
          # No dispatch: pushed under the App, this tag fires release.yml's
          # on:push:tags trigger directly.
