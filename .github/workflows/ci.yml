# Lifecycle-aware validation inherited from playbook-engineering ENG-0004.
# The immutable policy action is the fail-closed actor and fork boundary before
# repository code is checked out or executed.
name: CI
run-name: CI ${{ github.event_name }} purpose=${{ inputs.purpose || 'automatic' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purpose:
        description: Why the complete suite is being run manually
        required: true
        type: choice
        options:
          - exact-sha-preflight
          - diagnostics
          - release-recovery
          - workflow-testing
          - explicit-rerun

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  policy:
    name: Action Policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      run_full: ${{ steps.policy.outputs.run_full }}
      run_post_merge: ${{ steps.policy.outputs.run_post_merge }}
    steps:
      - id: policy
        uses: qwts/playbook-engineering/.github/actions/ci-policy@5455a3f5939369ea843b1bbb4d2573739f4381a6 # ci-policy 2026-08-20

  merge-evidence:
    name: Verify merged commit evidence
    needs: policy
    if: needs.policy.outputs.run_post_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find successful merge-group CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A workflow run's `.name` is its evaluated run-name. `.path` is the
          # stable identity of the canonical CI workflow.
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&head_sha=$GITHUB_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  preflight-evidence:
    name: Verify preflight evidence
    needs: policy
    if: github.event_name == 'pull_request' && needs.policy.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find successful manual complete suite for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .display_title == "CI workflow_dispatch purpose=exact-sha-preflight" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  complete:
    name: Complete suite
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6 # bounded-command 2026-08-20
        with:
          task: Install complete-suite dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: "600"
          attempts: "2"
          retry-delay-seconds: "5"

      - name: Run required validation
        run: npm run ci

      - name: Package extension
        run: |
          node scripts/check-version-policy.mjs --built
          node scripts/package-release.mjs

      - name: Upload extension build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bookmarkit-extension
          path: release/
          retention-days: 14

  zizmor:
    name: GitHub Actions security
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false
          version: "1.26.1"

  codeql:
    name: Advanced CodeQL
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      (needs.policy.outputs.run_post_merge == 'true' ||
      (needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true'))
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  workflow-runtime:
    name: Workflow runtime policy
    needs: policy
    if: needs.policy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned runtime checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/playbook-engineering
          ref: 5455a3f5939369ea843b1bbb4d2573739f4381a6
          path: .ci-runtime-policy
          sparse-checkout: tools/ci-runtime
          persist-credentials: false
      - name: Enforce bounded workflow runtime
        run: node .ci-runtime-policy/tools/ci-runtime/runtime-policy.mjs --root "$GITHUB_WORKSPACE"

  post-merge:
    name: Post-merge smoke
    needs: [policy, merge-evidence]
    if: needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6 # bounded-command 2026-08-20
        with:
          task: Install smoke dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: "600"
          attempts: "2"
          retry-delay-seconds: "5"

      - name: Build Chrome extension smoke
        run: npm run build:chrome

  gate:
    name: CI
    needs:
      [
        policy,
        merge-evidence,
        preflight-evidence,
        complete,
        zizmor,
        codeql,
        workflow-runtime,
        post-merge,
      ]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce the selected lifecycle lane
        env:
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY: ${{ needs.policy.result }}
          WORKFLOW_RUNTIME: ${{ needs.workflow-runtime.result }}
          COMPLETE: ${{ needs.complete.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
          CODEQL: ${{ needs.codeql.result }}
          PREFLIGHT: ${{ needs.preflight-evidence.result }}
          PREFLIGHT_VALIDATED: ${{ needs.preflight-evidence.outputs.validated }}
          MERGE_VALIDATED: ${{ needs.merge-evidence.outputs.validated }}
          POST_MERGE: ${{ needs.post-merge.result }}
        run: |
          test "$POLICY" = success
          test "$WORKFLOW_RUNTIME" = success
          case "$MODE" in
            full)
              if [ "$PREFLIGHT_VALIDATED" = true ]; then
                test "$PREFLIGHT" = success
              else
                test "$COMPLETE" = success
                test "$ZIZMOR" = success
                test "$CODEQL" = success
              fi
              ;;
            queue|manual)
              test "$COMPLETE" = success
              test "$ZIZMOR" = success
              test "$CODEQL" = success
              ;;
            post-merge)
              test "$CODEQL" = success
              if [ "$MERGE_VALIDATED" = true ]; then
                test "$POST_MERGE" = success
              else
                test "$COMPLETE" = success
                test "$ZIZMOR" = success
              fi
              ;;
            *) exit 1 ;;
          esac
