name: Close linked issues

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@4e70c773155c2c804e52a487352627010bea1897 # ci-policy 2026-08-03
        with:
          authorization-only: "true"

  close-linked-issues:
    name: Close linked issues
    needs: policy
    permissions:
      contents: read
      issues: write
      pull-requests: read
    # Keep in sync with TARGET_BASE_REFS in scripts/close-linked-issues.mjs.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Close issues referenced by merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/close-linked-issues.mjs
